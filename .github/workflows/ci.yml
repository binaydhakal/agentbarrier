name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - env:
          MATRIX_PYTHON: ${{ matrix.python-version }}
        run: uv sync --locked --extra test --extra all --python "$MATRIX_PYTHON"
      - if: matrix.python-version != '3.11'
        run: uv run pytest
      - if: matrix.python-version == '3.11'
        run: uv run pytest --cov=agentbarrier --cov-report=term-missing
      - if: matrix.python-version == '3.11'
        run: uv run ruff check .
      - if: matrix.python-version == '3.11'
        run: uv run ruff format --check .
      - if: matrix.python-version == '3.11'
        run: uv run mypy src examples
      - name: Generate compatibility evidence
        env:
          MATRIX_PYTHON: ${{ matrix.python-version }}
        run: >-
          uv run agentbarrier compatibility
          --json "build/compatibility/python-${MATRIX_PYTHON}.json"
      - name: Check canonical compatibility evidence
        if: matrix.python-version == '3.11'
        run: >-
          uv run agentbarrier compatibility
          --json docs/compatibility.json
          --markdown docs/compatibility.md
          --check
          --strict-missing
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-python-${{ matrix.python-version }}
          path: build/compatibility/
          if-no-files-found: error

  crewai:
    name: CrewAI evaluation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - env:
          MATRIX_PYTHON: ${{ matrix.python-version }}
        run: uv sync --locked --extra test --extra crewai --python "$MATRIX_PYTHON"
      - if: matrix.python-version != '3.11'
        run: uv run pytest tests/test_crewai_adapter.py
      - if: matrix.python-version == '3.11'
        run: >-
          uv run pytest tests/test_crewai_adapter.py
          --cov=agentbarrier.adapters.crewai
          --cov-config=.coveragerc-crewai
          --cov-report=term-missing
      - name: Generate CrewAI compatibility evidence
        env:
          MATRIX_PYTHON: ${{ matrix.python-version }}
        run: >-
          uv run agentbarrier compatibility
          --adapter crewai
          --json "build/crewai/python-${MATRIX_PYTHON}.json"
          --strict-missing
      - name: Check canonical CrewAI evidence
        if: matrix.python-version == '3.11'
        run: >-
          uv run agentbarrier compatibility
          --adapter crewai
          --json docs/crewai-evaluation.json
          --markdown docs/crewai-evaluation.md
          --check
          --strict-missing
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crewai-compatibility-python-${{ matrix.python-version }}
          path: build/crewai/
          if-no-files-found: error

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false
          python-version: "3.11"
      - run: uv sync --locked --extra test
      - run: uv build
      - run: uv run twine check dist/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
