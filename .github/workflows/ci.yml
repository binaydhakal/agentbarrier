name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - env:
          MATRIX_PYTHON: ${{ matrix.python-version }}
        run: uv sync --locked --extra test --extra all --python "$MATRIX_PYTHON"
      - if: matrix.python-version != '3.11'
        run: uv run pytest
      - if: matrix.python-version == '3.11'
        run: uv run pytest --cov=agentbarrier --cov-report=term-missing
      - if: matrix.python-version == '3.11'
        run: uv run ruff check .
      - if: matrix.python-version == '3.11'
        run: uv run ruff format --check .
      - if: matrix.python-version == '3.11'
        run: uv run mypy src examples
      - name: Generate compatibility evidence
        env:
          MATRIX_PYTHON: ${{ matrix.python-version }}
        run: >-
          uv run agentbarrier compatibility
          --json "build/compatibility/python-${MATRIX_PYTHON}.json"
      - name: Check canonical compatibility evidence
        if: matrix.python-version == '3.11'
        run: >-
          uv run agentbarrier compatibility
          --json docs/compatibility.json
          --markdown docs/compatibility.md
          --check
          --strict-missing
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: compatibility-python-${{ matrix.python-version }}
          path: build/compatibility/
          if-no-files-found: error

  crewai:
    name: CrewAI evaluation (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: ${{ matrix.python-version }}
          enable-cache: true
      - env:
          MATRIX_PYTHON: ${{ matrix.python-version }}
        run: uv sync --locked --extra test --extra crewai --python "$MATRIX_PYTHON"
      - if: matrix.python-version != '3.11'
        run: uv run pytest tests/test_crewai_adapter.py
      - if: matrix.python-version == '3.11'
        run: >-
          uv run pytest tests/test_crewai_adapter.py
          --cov=agentbarrier.adapters.crewai
          --cov-config=.coveragerc-crewai
          --cov-report=term-missing
      - name: Generate CrewAI compatibility evidence
        env:
          MATRIX_PYTHON: ${{ matrix.python-version }}
        run: >-
          uv run agentbarrier compatibility
          --adapter crewai
          --json "build/crewai/python-${MATRIX_PYTHON}.json"
          --strict-missing
      - name: Check canonical CrewAI evidence
        if: matrix.python-version == '3.11'
        run: >-
          uv run agentbarrier compatibility
          --adapter crewai
          --json docs/crewai-evaluation.json
          --markdown docs/crewai-evaluation.md
          --check
          --strict-missing
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: crewai-compatibility-python-${{ matrix.python-version }}
          path: build/crewai/
          if-no-files-found: error

  postgres:
    name: PostgreSQL parity (Python 3.11)
    runs-on: ubuntu-latest
    env:
      AGENTBARRIER_TEST_POSTGRES_DSN: postgresql://postgres:postgres@127.0.0.1:5432/agentbarrier
    services:
      postgres:
        image: postgres:18.4-alpine
        env:
          POSTGRES_DB: agentbarrier
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          python-version: "3.11"
          enable-cache: true
      - run: uv sync --locked --extra test --extra service --extra postgres
      - run: >-
          uv pip install --python .venv/bin/python
          "psycopg[binary]>=3.3,<4"
      - name: Run shared store contract and PostgreSQL integration tests
        run: >-
          uv run pytest
          tests/test_runtime_store_contract.py
          tests/test_postgres_runtime_store.py
          tests/test_runtime_wheel_audit.py
          --cov=agentbarrier.runtime.postgres
          --cov-config=.coveragerc-postgres
          --cov-report=term-missing
      - run: uv build
      - name: Audit installed wheel against PostgreSQL
        run: |
          uv venv --python 3.11 build/postgres-wheel-audit
          uv pip install --python build/postgres-wheel-audit/bin/python \
            dist/*.whl \
            "psycopg[binary]>=3.3,<4"
          build/postgres-wheel-audit/bin/python tools/audit_postgres_wheel.py

  package:
    name: Build package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@ae62891fec2bb8e7d6c99fc78c9fec3a63790f8d # v10.0.0
        with:
          enable-cache: false
          python-version: "3.11"
      - run: uv sync --locked --extra test
      - run: uv build
      - run: uv run twine check dist/*
      - name: Audit clean wheel runtime lifecycles
        run: |
          uv venv --python 3.11 build/wheel-audit
          uv pip install --python build/wheel-audit/bin/python dist/*.whl
          build/wheel-audit/bin/python tools/audit_runtime_wheel.py
          build/wheel-audit/bin/python tools/audit_runtime_controls_wheel.py
          uv pip install --python build/wheel-audit/bin/python \
            "mcp>=2,<3" \
            "httpx2>=2.12,<3" \
            "httpx>=0.27,<1" \
            "starlette>=0.47,<2" \
            "uvicorn>=0.34,<1"
          build/wheel-audit/bin/python tools/audit_mcp_gateway_wheel.py
          build/wheel-audit/bin/python tools/audit_dashboard_wheel.py
          build/wheel-audit/bin/python tools/audit_multi_user_wheel.py
          build/wheel-audit/bin/python tools/audit_slack_wheel.py
          uv pip install --python build/wheel-audit/bin/python "langgraph>=1.2,<2"
          build/wheel-audit/bin/python tools/audit_langgraph_wheel.py
          uv pip install --python build/wheel-audit/bin/python "pydantic-ai-slim>=2.32,<3"
          build/wheel-audit/bin/python tools/audit_pydantic_ai_wheel.py
          uv pip install --python build/wheel-audit/bin/python "google-adk>=2.7,<3"
          build/wheel-audit/bin/python tools/audit_google_adk_wheel.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: distributions
          path: dist/
          if-no-files-found: error
