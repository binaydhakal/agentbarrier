name: Bug report
description: Report incorrect AgentBarrier behavior or an unexpected error.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve AgentBarrier. Do not include production credentials, private
        traces, or unredacted tool arguments.
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
      placeholder: AgentBarrier reported ...; I expected ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe example or repository link that reproduces the issue.
      render: python
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: AgentBarrier version
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python and operating system
      placeholder: Python 3.12.5 on macOS 15
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Sanitized output
      description: Paste the console output or report after removing secrets and private data.
      render: shell
  - type: checkboxes
    id: checks
    attributes:
      label: Safety checks
      options:
        - label: The reproduction uses only sentinel or disposable effects.
          required: true
        - label: I removed credentials and private data from this report.
          required: true
        - label: I searched existing issues for the same behavior.
          required: true
