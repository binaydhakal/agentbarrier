[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentbarrier"
dynamic = ["version"]
description = "Deterministic approval and side-effect safety tests for AI agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Binaya Dhakal", email = "binaydhakal35@gmail.com" },
]
keywords = [
  "ai",
  "agents",
  "agentic-ai",
  "llm",
  "testing",
  "pytest",
  "safety",
  "agent-safety",
  "approval",
  "human-in-the-loop",
  "tool-calling",
  "guardrails",
  "idempotency",
  "cancellation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
openai = ["openai-agents>=0.22,<1"]
langgraph = ["langgraph>=1.2,<2; python_version >= '3.11'"]
pydantic-ai = ["pydantic-ai-slim>=2.32,<3"]
google-adk = ["google-adk>=2.7,<3"]
autogen = ["autogen-core>=0.7.5,<0.8"]
test = [
  "build>=1.2.2",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "ruff>=0.11",
  "twine>=6.1",
]
all = [
  "openai-agents>=0.22,<1",
  "langgraph>=1.2,<2; python_version >= '3.11'",
  "pydantic-ai-slim>=2.32,<3",
  "google-adk>=2.7,<3",
  "autogen-core>=0.7.5,<0.8",
]

[project.urls]
Homepage = "https://github.com/binaydhakal/agentbarrier"
Documentation = "https://github.com/binaydhakal/agentbarrier#readme"
Repository = "https://github.com/binaydhakal/agentbarrier"
Issues = "https://github.com/binaydhakal/agentbarrier/issues"
Changelog = "https://github.com/binaydhakal/agentbarrier/blob/main/CHANGELOG.md"
Compatibility = "https://github.com/binaydhakal/agentbarrier/blob/main/docs/compatibility.md"
"CI Guide" = "https://github.com/binaydhakal/agentbarrier/blob/main/docs/ci.md"

[project.scripts]
agentbarrier = "agentbarrier.cli:main"

[project.entry-points.pytest11]
agentbarrier = "agentbarrier.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbarrier"]

[tool.hatch.version]
path = "src/agentbarrier/__init__.py"

[tool.pytest.ini_options]
# Disable this project's installed plugin while testing itself so coverage starts before package
# import. End-user projects still auto-load the `pytest11` entry point normally.
addopts = "--strict-config --strict-markers -p no:agentbarrier"
testpaths = ["tests"]
markers = [
  "integration: tests that exercise an optional agent framework",
]

[tool.coverage.run]
branch = true
source = ["agentbarrier"]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agentbarrier"]
