[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "agentbarrier"
dynamic = ["version"]
description = "Transaction-safe policy, approval, and execution gateway for AI-agent actions"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
  { name = "Binaya Dhakal", email = "binaydhakal35@gmail.com" },
]
keywords = [
  "ai",
  "agents",
  "agentic-ai",
  "llm",
  "testing",
  "pytest",
  "safety",
  "agent-safety",
  "approval",
  "human-in-the-loop",
  "tool-calling",
  "mcp",
  "policy-as-code",
  "ai-firewall",
  "guardrails",
  "idempotency",
  "rate-limiting",
  "kill-switch",
  "blast-radius",
  "cancellation",
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Framework :: Pytest",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Topic :: Security",
  "Topic :: Software Development :: Quality Assurance",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
  "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
mcp = [
  "mcp>=2,<3",
  "httpx2>=2.12,<3",
  "uvicorn>=0.34,<1",
]
service = [
  "httpx>=0.27,<1",
  "starlette>=0.47,<2",
  "uvicorn>=0.34,<1",
]
slack = [
  "httpx>=0.27,<1",
  "starlette>=0.47,<2",
  "uvicorn>=0.34,<1",
]
postgres = ["psycopg>=3.3,<4"]
postgres-binary = ["psycopg[binary]>=3.3,<4"]
observability = ["opentelemetry-api>=1.31,<2"]
openai = ["openai-agents>=0.22,<1"]
langgraph = ["langgraph>=1.2,<2; python_version >= '3.11'"]
pydantic-ai = ["pydantic-ai-slim>=2.32,<3"]
google-adk = ["google-adk>=2.7,<3"]
autogen = ["autogen-core>=0.7.5,<0.8"]
crewai = [
  "crewai>=1.15.17,<2; python_version < '3.14'",
  "onnxruntime>=1.22,<1.24; python_version < '3.11'",
]
test = [
  "build>=1.2.2",
  "jsonschema>=4.26",
  "mypy>=1.15",
  "pytest>=8.3",
  "pytest-cov>=6.0",
  "pyyaml>=6,<7",
  "ruff>=0.11",
  "twine>=6.1",
]
all = [
  "mcp>=2,<3",
  "httpx2>=2.12,<3",
  "httpx>=0.27,<1",
  "starlette>=0.47,<2",
  "uvicorn>=0.34,<1",
  "psycopg>=3.3,<4",
  "opentelemetry-api>=1.31,<2",
  "openai-agents>=0.22,<1",
  "langgraph>=1.2,<2; python_version >= '3.11'",
  "pydantic-ai-slim>=2.32,<3",
  "google-adk>=2.7,<3",
  "autogen-core>=0.7.5,<0.8",
]

[project.urls]
Homepage = "https://github.com/binaydhakal/agentbarrier"
Documentation = "https://github.com/binaydhakal/agentbarrier#readme"
Repository = "https://github.com/binaydhakal/agentbarrier"
Issues = "https://github.com/binaydhakal/agentbarrier/issues"
Changelog = "https://github.com/binaydhakal/agentbarrier/blob/main/CHANGELOG.md"
Compatibility = "https://github.com/binaydhakal/agentbarrier/blob/main/docs/compatibility.md"
"CI Guide" = "https://github.com/binaydhakal/agentbarrier/blob/main/docs/ci.md"
Deployment = "https://github.com/binaydhakal/agentbarrier/blob/main/docs/deployment.md"

[project.scripts]
agentbarrier = "agentbarrier.cli:main"

[project.entry-points.pytest11]
agentbarrier = "agentbarrier.pytest_plugin"

[tool.hatch.build.targets.wheel]
packages = ["src/agentbarrier"]

[tool.hatch.version]
path = "src/agentbarrier/__init__.py"

[tool.pytest.ini_options]
# Disable this project's installed plugin while testing itself so coverage starts before package
# import. End-user projects still auto-load the `pytest11` entry point normally.
addopts = "--strict-config --strict-markers -p no:agentbarrier"
testpaths = ["tests"]
markers = [
  "integration: tests that exercise an optional agent framework",
]

[tool.coverage.run]
branch = true
source = ["agentbarrier"]
# CrewAI and PostgreSQL are each measured at 90%+ in their real isolated jobs. CrewAI cannot
# coexist with the OpenAI Agents extra, and PostgreSQL requires a live database service.
omit = [
  "src/agentbarrier/adapters/crewai.py",
  "src/agentbarrier/runtime/postgres.py",
]

[tool.coverage.report]
show_missing = true
skip_covered = true
fail_under = 90

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.10"
strict = true
packages = ["agentbarrier"]

[tool.uv]
conflicts = [
  [
    { extra = "mcp" },
    { extra = "crewai" },
  ],
  [
    { extra = "openai" },
    { extra = "crewai" },
  ],
  [
    { extra = "all" },
    { extra = "crewai" },
  ],
]
