<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">AgentBarrier</title>
  <desc id="description">Deterministic control-plane safety tests for AI agents</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b18"/>
      <stop offset="1" stop-color="#14102d"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#7c3aed"/>
    </linearGradient>
    <pattern id="grid" width="42" height="42" patternUnits="userSpaceOnUse">
      <path d="M 42 0 L 0 0 0 42" fill="none" stroke="#93c5fd" stroke-opacity="0.055" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1280" height="640" rx="32" fill="url(#background)"/>
  <rect width="1280" height="640" rx="32" fill="url(#grid)"/>
  <circle cx="300" cy="320" r="285" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect x="90" y="110" width="420" height="420" rx="92" fill="#0d1325" stroke="url(#accent)" stroke-width="2" stroke-opacity="0.7"/>
    <image x="140" y="160" width="320" height="320" xlink:href="agentbarrier-icon.png"/>
  </g>

  <rect x="566" y="156" width="120" height="8" rx="4" fill="url(#accent)"/>
  <text x="566" y="264" fill="#f8fafc" font-family="Arial" font-size="84" font-weight="700" letter-spacing="-2">AgentBarrier</text>
  <text x="570" y="335" fill="#cbd5e1" font-family="Arial" font-size="34" font-weight="500">
    <tspan x="570" dy="0">Deterministic control-plane safety tests</tspan>
    <tspan x="570" dy="48">for AI-agent tool execution.</tspan>
  </text>

  <g transform="translate(570 450)">
    <rect width="620" height="58" rx="29" fill="#111a31" stroke="#334155" stroke-width="1.5"/>
    <circle cx="29" cy="29" r="7" fill="#22d3ee"/>
    <text x="52" y="36" fill="#a5f3fc" font-family="Arial" font-size="18" font-weight="700" letter-spacing="1">MODEL-FREE · DETERMINISTIC · PYTEST</text>
  </g>
</svg>
